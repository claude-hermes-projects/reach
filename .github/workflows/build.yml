# After every merge into main: run all tests, then build the Mac app and keep the zip for download
# (GitHub → Actions → "Build app" → the latest run → Artifacts → Reach-app).
name: Build app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Run every test
        run: python3 tests/run.py
      - name: Build the app
        run: |
          python3 -m pip install --quiet "pillow==12.3.0"
          python3 tools-dev/make_app.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Reach-app
          path: dist/Reach-app.zip
          retention-days: 30
