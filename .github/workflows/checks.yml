# Runs every test on each change request, and refuses agent branches that edit the tests.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Agents may not change the tests
        if: startsWith(github.head_ref, 'agent/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q '^tests/\|^\.github/\|^tools-dev/'; then
            echo "::error::This agent branch changes tests, workflows or dev tools. Only the card's files may change."
            exit 1
          fi
      - name: Run every test
        run: python3 tests/run.py
